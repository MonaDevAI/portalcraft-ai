<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">PortalCraft AI logo</title>
  <desc id="description">A luminous portal formed by connected layers beside the PortalCraft AI wordmark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102f4b"/>
    </linearGradient>
    <linearGradient id="portal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#49d3ff"/>
      <stop offset="0.55" stop-color="#7b8cff"/>
      <stop offset="1" stop-color="#c36bff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="36" fill="url(#background)"/>
  <g transform="translate(70 42)">
    <path d="M42 252V112C42 50 92 0 154 0s112 50 112 112v140h-45V112c0-37-30-67-67-67s-67 30-67 67v140z" fill="none" stroke="url(#portal)" stroke-width="22" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M112 252V128c0-23 19-42 42-42s42 19 42 42v124" fill="none" stroke="#d8f7ff" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
    <path d="M18 252h272" stroke="#49d3ff" stroke-width="12" stroke-linecap="round"/>
    <circle cx="42" cy="252" r="14" fill="#49d3ff"/>
    <circle cx="154" cy="86" r="14" fill="#8b83ff"/>
    <circle cx="266" cy="252" r="14" fill="#c36bff"/>
    <path d="M42 252L154 86l112 166" fill="none" stroke="url(#portal)" stroke-width="6" stroke-dasharray="10 12" opacity="0.8"/>
  </g>
  <g transform="translate(405 106)">
    <text x="0" y="76" fill="#f7fbff" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2">PortalCraft</text>
    <rect x="431" y="14" width="116" height="76" rx="20" fill="url(#portal)"/>
    <text x="489" y="70" fill="#071426" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" text-anchor="middle">AI</text>
    <text x="4" y="124" fill="#a9c4d9" font-family="Segoe UI, Arial, sans-serif" font-size="24" letter-spacing="4">GOVERNED PORTAL INTELLIGENCE</text>
  </g>
</svg>
